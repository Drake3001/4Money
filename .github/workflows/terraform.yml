name: Terraform Plan

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# PR checks cannot replace pending deployment runs.
concurrency:
  group: terraform-proxmox-lab-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform checks and plan
    # Only repository branches are eligible; never use pull_request_target.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: proxmox-infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check runner tools
        run: |
          for tool in git unzip curl python3; do
            if ! command -v "$tool" > /dev/null; then
              echo "::error::Missing runner dependency: $tool. Install it during host maintenance."
              exit 1
            fi
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Test deployment safeguards
        run: python3 -m unittest discover -s tests -v

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Check required configuration
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_INSECURE: ${{ vars.PROXMOX_VE_INSECURE }}
          TF_VAR_test_vm_ssh_public_key: ${{ vars.TEST_VM_SSH_PUBLIC_KEY }}
        run: |
          for variable in TF_TOKEN_app_terraform_io PROXMOX_VE_API_TOKEN PROXMOX_VE_ENDPOINT PROXMOX_VE_INSECURE TF_VAR_test_vm_ssh_public_key; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required GitHub secret or variable: $variable"
              exit 1
            fi
          done
          case "$PROXMOX_VE_INSECURE" in
            true|false) ;;
            *) echo "::error::PROXMOX_VE_INSECURE must be true or false"; exit 1 ;;
          esac

      - name: Prepare private plan directory
        run: |
          directory=$(mktemp -d "$RUNNER_TEMP/proxmox-plan.XXXXXXXXXX")
          echo "TF_PLAN_DIR=$directory" >> "$GITHUB_ENV"

      - name: Terraform Init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init -input=false -lockfile=readonly -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          PROXMOX_VE_ENDPOINT: ${{ vars.PROXMOX_VE_ENDPOINT }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          PROXMOX_VE_INSECURE: ${{ vars.PROXMOX_VE_INSECURE }}
          TF_VAR_test_vm_ssh_public_key: ${{ vars.TEST_VM_SSH_PUBLIC_KEY }}
        run: bash scripts/ci-plan.sh

      - name: Clean up saved plan
        if: always()
        run: |
          directory="${TF_PLAN_DIR:-}"
          suffix="${directory#"$RUNNER_TEMP/proxmox-plan."}"
          if [[ "$directory" == "$RUNNER_TEMP"/proxmox-plan.* && "$suffix" =~ ^[A-Za-z0-9]+$ ]]; then
            rm -rf -- "$directory"
          fi
