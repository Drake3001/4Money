name: Backend CI

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect backend
        id: detect
        run: |
          if [[ ! -d backend/ZPI4M.Backend ]]; then
            echo "Backend not present — checks skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f backend/ZPI4M.Backend/ZPI4M.Backend.slnx ]]; then
            echo "::error::Backend exists but ZPI4M.Backend.slnx is missing."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Restore backend
        if: steps.detect.outputs.present == 'true'
        working-directory: backend/ZPI4M.Backend
        run: dotnet restore ZPI4M.Backend.slnx

      - name: Check style
        if: steps.detect.outputs.present == 'true'
        working-directory: backend/ZPI4M.Backend
        run: |
          dotnet format style ZPI4M.Backend.slnx --severity warn --verify-no-changes --no-restore
          dotnet format whitespace ZPI4M.Backend.slnx --verify-no-changes --no-restore

      - name: Run unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend/ZPI4M.Backend
        run: dotnet test ZPI4M.Backend.slnx --configuration Release --no-restore --filter "Category=Unit"

      - name: Run integration tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend/ZPI4M.Backend
        run: dotnet test ZPI4M.Backend.slnx --configuration Release --no-restore --filter "Category=Integration"
