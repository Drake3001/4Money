name: Publish images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI before publishing
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/backend.yml

  images:
    name: Publish ${{ matrix.component }}
    needs: checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - component: backend
            context: backend/ZPI4M.Backend
            dockerfile: containers/dockerfiles/Dockerfile.backend
          - component: migrations
            context: backend/ZPI4M.Backend
            dockerfile: containers/dockerfiles/Dockerfile.migrations
          - component: frontend
            context: frontend
            dockerfile: containers/dockerfiles/Dockerfile.frontend.deploy
          - component: ocr
            context: workers/extraction_worker
            dockerfile: containers/dockerfiles/Dockerfile.worker
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set image name and tag
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=images-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.component }}

      - name: Summarize published image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Image: \`$IMAGE_NAME:$IMAGE_TAG\`"
            echo "Digest: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo "Server env: \`IMAGE_TAG=$IMAGE_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
