      required: [proposal, warnings, needsReview, rawResult]
      properties:
        proposal:
          $ref: '#/components/schemas/ReceiptDraft'
        warnings:
          type: array
          items:
            type: string
        needsReview:
          type: boolean
        rawResult:
          type: object
          additionalProperties: true
    ReceiptOcrResponse:
      type: object
      required: [proposal, warnings, needsReview, ocrProof]
      properties:
        proposal:
          $ref: '#/components/schemas/ReceiptDraft'
        warnings:
          type: array
          items:
            type: string
        needsReview:
          type: boolean
        ocrProof:
          type: string
          maxLength: 4194304
          description: Opaque signed result bound to the image and user for 24 hours.
    ReceiptResponse:
      type: object
      required: [id, expenseId, fileUrl, fileUrlExpiresAt, analysis]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        expenseId:
          $ref: '#/components/schemas/Id'
        fileUrl:
          type: string
          format: uri
        fileUrlExpiresAt:
          $ref: '#/components/schemas/UtcTime'
        analysis:
          type: object
          nullable: true
          properties:
            proposal:
              $ref: '#/components/schemas/ReceiptDraft'
            warnings:
              type: array
              items:
                type: string
            needsReview:
              type: boolean
            rawResult:
              type: object
              additionalProperties: true
          required: [proposal, warnings, needsReview, rawResult]
    ReceiptUploadRequest:
      type: object
      additionalProperties: false
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: Dokładnie jeden niepusty plik do 20 MiB. Obsługiwane typy MIME obejmują JPEG, PNG, WebP, HEIC/HEIF, TIFF, BMP i PDF. Zawartość i limit stron sprawdza worker podczas OCR.
    ProblemDetails:
      type: object
      description: Standardowe ASP.NET Core ProblemDetails; bez dodatkowej koperty i bez wymaganego własnego code.
        traceId to rozszerzenie diagnostyczne, nie sekret. title/detail nie są stabilnymi identyfikatorami do sterowania
        UI.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
            description: Klucze nazw pól JSON, np. items[0].quantity. Dla błędu całego formularza pusty klucz.
  responses:
    Unauthorized:
      description: Brak lub nieważny JWT / niedostępne konto. Standardowe wyzwanie Bearer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/Unauthorized'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer
    Forbidden:
      description: Zasób jest dostępny do odczytu, ale użytkownik nie ma prawa wykonać tej operacji, np. były uczestnik
        próbuje edytować.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/Forbidden'
    NotFound:
      description: Zasób nie istnieje lub jest niedostępny do odczytu. Nie ujawniamy istnienia cudzych wydatków,
        rachunków i uploadów.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/NotFound'
    Conflict:
      description: Nieaktualna wersja, zajęte źródło lub próba usunięcia przypiętego paragonu. Odśwież dane; nie
        ponawiaj automatycznie zapisu.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/Conflict'
            source:
              $ref: '#/components/examples/SourceConflict'
    PayloadTooLarge:
      description: Przekroczono limit pliku 20 MiB lub całego żądania multipart 50 MiB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/PayloadTooLarge'
    UnsupportedMediaType:
      description: Nieobsługiwany typ pliku lub Content-Type. Dla requestów JSON wymagane application/json; upload
        wymaga multipart/form-data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/UnsupportedMediaType'
    UnprocessableReceipt:
      description: Uszkodzony, pusty lub nieczytelny dokument, ponad 4 strony albo przekroczone limity pikseli;
        brak użytecznej analizy. Upload nie wymaga skutecznego OCR.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/UnprocessableReceipt'
    BadGateway:
      description: Dostawca OCR zwrócił niepoprawną odpowiedź; poprzednie analizy i wydatek pozostają bez zmian.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/BadGateway'
    Unavailable:
      description: Niedostępna baza, storage lub usługa OCR. Zachowaj formularz; wynik zapisu po utracie odpowiedzi
        może być niepewny.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/Unavailable'
    GatewayTimeout:
      description: Przekroczono czas oczekiwania na OCR; nie zmieniono wydatku.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            default:
              $ref: '#/components/examples/GatewayTimeout'
    Validation:
      description: Błąd składni, pól lub reguł formularza. Szczegóły w errors; frontend wiąże je z polami. Niepoprawny
        GUID, zakres, wersja pominięta i niespójność danych bankowych także 400.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            field:
              $ref: '#/components/examples/FieldValidation'
            bank:
              $ref: '#/components/examples/BankValidation'
