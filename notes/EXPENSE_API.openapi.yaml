openapi: 3.0.3
info:
  title: 4Money Expense — kontrakt do implementacji
  version: 0.4.0
  description: Receipt OCR is transient. Expense creation and editing accept an optional receipt file and a signed OCR proof.
servers:
- url: http://localhost:5283
  description: Docelowy lokalny profil HTTP, po implementacji; ten plik nie uruchamia API.
tags:
- name: Expenses
- name: Categories
- name: Bank sources
- name: Receipts
security:
- BearerAuth: []
paths:
  /api/categories:
    get:
      operationId: listExpenseCategories
      tags:
      - Categories
      summary: Pobierz słownik kategorii
      description: Bez paginacji; kategorie uporządkowane po nazwie, następnie ID. Nie ma operacji edycji słownika.
      responses:
        '200':
          description: Powodzenie.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
              examples:
                Categories:
                  $ref: '#/components/examples/Categories'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-implementation-status: implemented-stage-1
  /api/expenses:
    get:
      operationId: listExpenses
      tags:
      - Expenses
      summary: Pobierz historię wydatków
      description: Paginacja i totalCount po filtrach i autoryzacji; nie pobiera danych z banku zdalnego. Nazwy
        profili i grup bez adresów email lub danych rachunku.
      responses:
        '200':
          description: Powodzenie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePage'
              examples:
                ExpenseHistory:
                  $ref: '#/components/examples/ExpenseHistory'
                EmptyExpenseHistory:
                  $ref: '#/components/examples/EmptyExpenseHistory'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: groupId
        in: query
        required: false
        description: 'Bez participantId: wszystkie dostępne wydatki grupy. Brak groupId i participantId: moje udziały,
          także po odejściu.'
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: participantId
        in: query
        required: false
        description: Filtr uczestnika kosztu, nie autora; nie rozszerza dostępu. Bez grupy wskazany uczestnik jest
          filtrem dostępnych wydatków.
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: payerId
        in: query
        required: false
        description: Filtr płatnika; sam nie wyłącza domyślnego filtra moich udziałów.
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: transactionTimeFrom
        in: query
        required: false
        description: Początek włącznie.
        schema:
          type: string
          format: date
          description: Data YYYY-MM-DD bez godziny i strefy; przyszłe daty dozwolone.
      - name: transactionTimeTo
        in: query
        required: false
        description: Koniec wyłącznie; from musi być < to.
        schema:
          type: string
          format: date
          description: Data YYYY-MM-DD bez godziny i strefy; przyszłe daty dozwolone.
      - name: minAmount
        in: query
        required: false
        description: Włącznie; kwota całego wydatku, nie udziału.
        schema:
          type: string
          pattern: ^[0-9]{1,16}(\.[0-9]{1,2})?$
          description: Tekst dziesiętny numeric(18,2), kropka; bez spacji, separatorów tysięcy, plusa i notacji
            wykładniczej. Odpowiedzi zawsze 2 miejsca. Wartość musi być > 0.
      - name: maxAmount
        in: query
        required: false
        description: Włącznie; minAmount <= maxAmount.
        schema:
          type: string
          pattern: ^[0-9]{1,16}(\.[0-9]{1,2})?$
          description: Tekst dziesiętny numeric(18,2), kropka; bez spacji, separatorów tysięcy, plusa i notacji
            wykładniczej. Odpowiedzi zawsze 2 miejsca. Wartość musi być > 0.
      - name: categoryId
        in: query
        required: false
        description: Co najmniej jedna pozycja tej kategorii; zwracany jest cały wydatek. Dopuszcza systemowe Nieznane.
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: search
        in: query
        required: false
        description: Nazwa wydatku lub sprzedawca, dopasowanie fragmentu bez rozróżniania wielkości liter; trim,
          pusty ignorowany.
        schema:
          type: string
      - name: hasReceipt
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: hasBankTransaction
        in: query
        required: false
        description: ''
        schema:
          type: boolean
      - name: sortBy
        in: query
        required: false
        description: Nazwy wartości case-insensitive jak w Banking; nieznana wartość 400.
        schema:
          type: string
          enum:
          - transactionTime
          - amount
          - name
          default: transactionTime
      - $ref: '#/components/parameters/Descending'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      x-implementation-status: implemented-expense
    post:
      operationId: createExpense
      tags:
      - Expenses
      summary: Utwórz wydatek
      description: Create an expense and optionally attach a new receipt in one database transaction.
      responses:
        '201':
          description: Powodzenie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
              examples:
                ExpenseDetails:
                  $ref: '#/components/examples/ExpenseDetails'
                LinkedExpense:
                  $ref: '#/components/examples/LinkedExpense'
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL GET utworzonego zasobu generowany przez routing.
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          description: File or request exceeds its size limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
            examples:
              CreateManual:
                $ref: '#/components/examples/CreateManual'
              CreateCalculatedAmount:
                $ref: '#/components/examples/CreateCalculatedAmount'
              CreateWithBank:
                $ref: '#/components/examples/CreateWithBank'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [expense, file]
              properties:
                expense:
                  type: string
                  description: JSON serialized CreateExpenseRequest.
                file:
                  type: string
                  format: binary
                  description: One receipt file, up to 20 MiB.
                ocrProof:
                  type: string
                  maxLength: 4194304
                  description: Optional proof returned by analyze for this file.
      x-implementation-status: implemented-stage-1
  /api/expenses/preview:
    post:
      operationId: previewExpense
      tags:
      - Expenses
      summary: Przelicz formularz bez zapisu
      description: Validate and calculate the expense form without file upload or OCR.
      responses:
        '200':
          description: Powodzenie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePreviewResponse'
              examples:
                ExpensePreview:
                  $ref: '#/components/examples/ExpensePreview'
                PreviewCentRemainder:
                  $ref: '#/components/examples/PreviewCentRemainder'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewExpenseRequest'
            examples:
              PreviewCreate:
                $ref: '#/components/examples/PreviewCreate'
              PreviewEdit:
                $ref: '#/components/examples/PreviewEdit'
      x-implementation-status: implemented-stage-1
  /api/expenses/{expenseId}:
    parameters:
    - $ref: '#/components/parameters/ExpenseId'
    get:
      operationId: getExpense
      tags:
      - Expenses
      summary: Pobierz pełne szczegóły
      description: 'Aktualny członek: odczyt wszystkich wydatków grupy. Były członek: tylko jako płatnik lub uczestnik
        tego wydatku, z canEdit=false i canDelete=false. Cudzy/niedostępny zasób daje 404.'
      responses:
        '200':
          description: Powodzenie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
              examples:
                ExpenseDetails:
                  $ref: '#/components/examples/ExpenseDetails'
                LinkedExpense:
                  $ref: '#/components/examples/LinkedExpense'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      x-implementation-status: implemented-stage-1
    put:
      operationId: updateExpense
      tags:
      - Expenses
      summary: Zapisz cały formularz edycji
      description: Update an expense with its current version. A file replaces the receipt and removeReceipt detaches it.
      responses:
        '200':
          description: Powodzenie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
              examples:
                UpdatedExpense:
                  $ref: '#/components/examples/UpdatedExpense'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          description: File or request exceeds its size limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
            examples:
              UpdateManual:
                $ref: '#/components/examples/UpdateManual'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [expense, file]
              properties:
                expense:
                  type: string
                  description: JSON serialized UpdateExpenseRequest.
                file:
                  type: string
                  format: binary
                  description: One receipt file, up to 20 MiB.
                ocrProof:
                  type: string
                  maxLength: 4194304
                  description: Optional proof returned by analyze for this file.
      x-implementation-status: implemented-expense
    delete:
      operationId: deleteExpense
      tags:
      - Expenses
      summary: Usuń wydatek
      description: 'Aktualny członek grupy; wymagana version. Usuwa wydatek, pozycje, udziały i paragon. Transakcja
        bankowa pozostaje i zostaje zwolniona. Brak zasobu: 404. Usunięcie paragonu i pliku po zatwierdzeniu wydatku. Awaria sprzątania nie przywraca wydatku.'
      responses:
        '204':
          description: Wydatek usunięty; brak body.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/Version'
      x-implementation-status: implemented-expense
  /api/expenses/available-bank-transactions:
    get:
      operationId: listAvailableExpenseBankTransactions
      tags:
      - Bank sources
      summary: Pobierz transakcje do przypięcia
      description: Tylko własne, Booked, ujemne PLN, globalnie nieprzypisane do Expense. Wykluczenie zajętych ID
        przed paginacją i totalCount. Aktualna przypięta transakcja nie występuje na tej liście; jej ID jest w szczegółach
        Expense. Lista nie rezerwuje transakcji.
      responses:
        '200':
          description: Powodzenie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableBankTransactionPage'
              examples:
                AvailableTransactions:
                  $ref: '#/components/examples/AvailableTransactions'
                EmptyAvailableTransactions:
                  $ref: '#/components/examples/EmptyAvailableTransactions'
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store,no-cache
              description: Zawiera dyrektywę no-store, zgodnie ze wspólnym ResponseCache ASP.NET Core.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: bankAccountId
        in: query
        required: false
        description: Tylko własny rachunek; cudzy lub nieistniejący daje 404.
        schema:
          type: string
          format: uuid
          pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: dateFrom
        in: query
        required: false
        description: Data bankowa włącznie.
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: false
        description: Data bankowa włącznie; from <= to.
        schema:
          type: string
          format: date
      - name: minAmount
        in: query
        required: false
        description: Oryginalna ujemna kwota bankowa, włącznie.
        schema:
          type: string
          pattern: ^-?[0-9]{1,16}(\.[0-9]{1,2})?$
          description: Tekst dziesiętny numeric(18,2), kropka; bez spacji, separatorów tysięcy, plusa i notacji
            wykładniczej. Odpowiedzi zawsze 2 miejsca.
      - name: maxAmount
        in: query
        required: false
        description: Oryginalna ujemna kwota bankowa, włącznie; min <= max.
        schema:
          type: string
          pattern: ^-?[0-9]{1,16}(\.[0-9]{1,2})?$
          description: Tekst dziesiętny numeric(18,2), kropka; bez spacji, separatorów tysięcy, plusa i notacji
            wykładniczej. Odpowiedzi zawsze 2 miejsca.
      - name: description
        in: query
        required: false
        description: Fragment opisu bez rozróżniania wielkości liter; pusty ignorowany.
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        description: Jak w Banking, case-insensitive. status=Booked i currencyCode=PLN są stałe, nie są filtrami
          requestu.
        schema:
          type: string
          enum:
          - date
          - amount
          - status
          - currencyCode
          default: date
      - $ref: '#/components/parameters/Descending'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      x-implementation-status: implemented-stage-1
  /api/expenses/receipts/analyze:
    post:
      operationId: analyzeExpenseReceipt
      tags: [Receipts]
      summary: Analyze a receipt file without saving it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiptUploadRequest'
      responses:
        '200':
          description: OCR proposal and signed proof for a later save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptOcrResponse'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File or request exceeds its size limit.
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableReceipt'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/expenses/{expenseId}/receipt:
    parameters:
    - $ref: '#/components/parameters/ExpenseId'
    get:
      operationId: getExpenseReceipt
      tags: [Receipts]
      summary: Read the receipt attached to an accessible expense
      responses:
        '200':
          description: Signed file URL and saved OCR result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT aplikacji User. Tożsamość wywołującego z ICurrentUser; nie jest parametrem requestu.
  parameters:
    PageNumber:
      name: pageNumber
      in: query
      required: false
      description: Indeks strony od 1; offset musi mieścić się w int32.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: ''
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Descending:
      name: descending
      in: query
      required: false
      description: Kierunek głównego sortowania; remisy po ID rosnąco (ordinal GUID).
      schema:
        type: boolean
        default: true
    ExpenseId:
      name: expenseId
      in: path
      required: true
      description: ''
      schema:
        type: string
        format: uuid
        pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    Version:
      name: version
      in: query
      required: true
      description: 'Token ze szczegółów. Brak/pusty: 400; nieaktualny: 409.'
      schema:
        type: string
        minLength: 1
        description: Nieprzezroczysty token; kopiuj bez parsowania z ostatnich szczegółów. Każdy udany PUT zmienia
          token.
  schemas:
    Id:
      type: string
      format: uuid
      pattern: ^(?!00000000-0000-0000-0000-000000000000$)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    UtcTime:
      type: string
      format: date-time
      pattern: Z$
      description: Moment UTC zakończony Z; przyszłe daty dozwolone.
    ExpenseDate:
      type: string
      format: date
      description: Data YYYY-MM-DD bez godziny i strefy; przyszłe daty dozwolone.
    Money:
      type: string
      pattern: ^-?[0-9]{1,16}(\.[0-9]{1,2})?$
      description: Tekst dziesiętny numeric(18,2), kropka; bez spacji, separatorów tysięcy, plusa i notacji wykładniczej.
        Odpowiedzi zawsze 2 miejsca.
    PositiveMoney:
      type: string
      pattern: ^[0-9]{1,16}(\.[0-9]{1,2})?$
      description: Tekst dziesiętny numeric(18,2), kropka; bez spacji, separatorów tysięcy, plusa i notacji wykładniczej.
        Odpowiedzi zawsze 2 miejsca. Wartość musi być > 0.
    Quantity:
      type: string
      pattern: ^[0-9]{1,15}(\.[0-9]{1,3})?$
      description: numeric(18,3), wartość > 0. Odpowiedzi zawsze 3 miejsca.
    Percentage:
      type: string
      pattern: ^[0-9]{1,3}(\.[0-9]{1,2})?$
      description: 0 < wartość <= 100; suma unikalnych uczestników dokładnie 100.00. Odpowiedzi zawsze 2 miejsca.
    Version:
      type: string
      minLength: 1
      description: Nieprzezroczysty token; kopiuj bez parsowania z ostatnich szczegółów. Każdy udany PUT zmienia
        token.
    CategoryResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - icon
      - isSystemGenerated
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          pattern: \S
