[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpi-receipt-extraction"
version = "0.1.0"
description = "Receipt extraction pipeline for images and PDF documents"
requires-python = ">=3.12,<3.13"
dependencies = ["Pillow>=10", "pypdfium2>=4.30"]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=5"]
dataset = ["gdown==6.4.2"]
ocr = ["rapidocr==3.10.0", "onnxruntime==1.31.0", "opencv-python-headless==5.0.0.93"]
experiment = ["docscan==1.0.6", "rembg[cpu]==2.0.67", "paddleocr==3.7.0", "paddlex==3.7.2", "paddlepaddle==3.3.1"]


[tool.setuptools.packages.find]
include = ["extraction*", "experiments*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
