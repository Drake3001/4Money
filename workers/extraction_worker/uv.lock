    { name = "torch", version = "2.14.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torch", version = "2.14.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { name = "torchvision", version = "0.29.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux' and sys_platform != 'win32'" },
    { name = "torchvision", version = "0.29.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
ocr-paddle = [
    { name = "paddleocr" },
    { name = "paddlepaddle" },
    { name = "paddlex" },
]
test = [
    { name = "pypdf" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "docscan", marker = "extra == 'experiment'", specifier = "==1.0.6" },
    { name = "easyocr", marker = "extra == 'ocr-easyocr'", specifier = "==1.7.2" },
    { name = "gdown", marker = "extra == 'dataset'", specifier = "==6.4.2" },
    { name = "onnxruntime", specifier = "==1.31.0" },
    { name = "opencv-python-headless", specifier = "==5.0.0.93" },
    { name = "paddleocr", marker = "extra == 'experiment'", specifier = "==3.7.0" },
    { name = "paddleocr", marker = "extra == 'ocr-paddle'", specifier = "==3.7.0" },
    { name = "paddlepaddle", marker = "extra == 'experiment'", specifier = "==3.3.1" },
    { name = "paddlepaddle", marker = "extra == 'ocr-paddle'", specifier = "==3.3.1" },
    { name = "paddlex", marker = "extra == 'experiment'", specifier = "==3.7.2" },
    { name = "paddlex", marker = "extra == 'ocr-paddle'", specifier = "==3.7.2" },
    { name = "pillow", specifier = ">=10" },
    { name = "pypdf", marker = "extra == 'test'", specifier = ">=5" },
    { name = "pypdfium2", specifier = ">=4.30" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=8" },
    { name = "rapidfuzz", marker = "extra == 'ocr-comparison'", specifier = ">=3,<4" },
    { name = "rapidocr", specifier = "==3.10.0" },
    { name = "rembg", extras = ["cpu"], marker = "extra == 'experiment'", specifier = "==2.0.67" },
    { name = "torch", marker = "(sys_platform == 'linux' and extra == 'ocr-easyocr') or (sys_platform == 'win32' and extra == 'ocr-easyocr')", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "zpi-receipt-extraction", extra = "ocr-easyocr" } },
    { name = "torch", marker = "sys_platform != 'linux' and sys_platform != 'win32' and extra == 'ocr-easyocr'" },
    { name = "torchvision", marker = "(sys_platform == 'linux' and extra == 'ocr-easyocr') or (sys_platform == 'win32' and extra == 'ocr-easyocr')", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "zpi-receipt-extraction", extra = "ocr-easyocr" } },
    { name = "torchvision", marker = "sys_platform != 'linux' and sys_platform != 'win32' and extra == 'ocr-easyocr'" },
]
provides-extras = ["test", "dataset", "ocr", "ocr-paddle", "ocr-easyocr", "ocr-comparison", "experiment"]
