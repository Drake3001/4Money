name: zpi4m-storage

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -admin.ui=false
      - -s3.autoCreateBucket=false
      - -bucket=${STORAGE_BUCKET:-receipts}
      - -master.volumeSizeLimitMB=128
      - -volume.max=8
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env}
    ports:
      - "${STORAGE_BIND_IP:-100.93.134.49}:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  storage_data:
    name: ${STORAGE_VOLUME_NAME:-zpi4m_storage_data}
