name: zpi4m

services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=zpi4m_db
    ports:
      - "5434:5432"
    volumes:
      - zpi4m_pgdata:/var/lib/postgresql/data
      - ../backend/ZPI4M.Database:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  zpi4m_pgdata:
