name: zpi4m-backend

services:
  backend:
    build:
      context: ../../backend/ZPI4M.Backend
      dockerfile: ../../containers/backend/Dockerfile
    env_file: ../../backend/ZPI4M.Backend/src/ZPI4M.Api/.env
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-5283}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
