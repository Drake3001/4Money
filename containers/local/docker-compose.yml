name: zpi4m

services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in containers/local/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in containers/local/.env}
      POSTGRES_DB: ${POSTGRES_DB:-zpi4m_db}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - zpi4m_pgdata:/var/lib/postgresql/data
      - ../../database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -webdav=false
      - -admin.ui=false
      - -s3.autoCreateBucket=false
      - -bucket=${STORAGE_BUCKET:-receipts}
      - -master.volumeSizeLimitMB=128
      - -volume.max=8
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?Set STORAGE_ACCESS_KEY in containers/local/.env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in containers/local/.env}
    ports:
      - "${STORAGE_BIND_IP:-127.0.0.1}:${STORAGE_PORT:-8333}:8333"
    volumes:
      - storage_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  extraction-worker:
    build:
      context: ../../workers/extraction_worker
      dockerfile: ../../containers/local/Dockerfile.worker
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-3.1-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      EXTRACTION_WORKFLOW: ${EXTRACTION_WORKFLOW:-vision_ocr}
      EXTRACTION_VISION_ROUTING: ${EXTRACTION_VISION_ROUTING:-throughput}
      EXTRACTION_MAX_FILE_BYTES: ${EXTRACTION_MAX_FILE_BYTES:-20971520}
      EXTRACTION_MAX_REQUEST_BYTES: ${EXTRACTION_MAX_REQUEST_BYTES:-52428800}
      EXTRACTION_MAX_PAGE_PIXELS: ${EXTRACTION_MAX_PAGE_PIXELS:-50000000}
      EXTRACTION_MAX_DOCUMENT_PIXELS: ${EXTRACTION_MAX_DOCUMENT_PIXELS:-100000000}
    ports:
      - "${EXTRACTION_BIND_ADDRESS:-127.0.0.1}:${EXTRACTION_PORT:-8000}:8000"
    volumes:
      - model-cache:/app/.cache
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  backend:
    build:
      context: ../../backend/ZPI4M.Backend
      dockerfile: ../../containers/local/Dockerfile.backend
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      DB_LOCAL_CONNECTION_STRING: 'Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-zpi4m_db};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}'
      USERAUTHENTICATION__SIGNINGKEY: ${USERAUTHENTICATION__SIGNINGKEY:?Set USERAUTHENTICATION__SIGNINGKEY in containers/local/.env}
      RECEIPTOCRPROOF__SIGNINGKEY: ${RECEIPTOCRPROOF__SIGNINGKEY:?Set RECEIPTOCRPROOF__SIGNINGKEY in containers/local/.env}
      GOOGLEAUTHENTICATION__ENABLED: ${GOOGLEAUTHENTICATION__ENABLED:-false}
      GOOGLEAUTHENTICATION__CLIENTID: ${GOOGLEAUTHENTICATION__CLIENTID:-}
      TINK__CLIENTID: ${TINK__CLIENTID:-}
      TINK__CLIENTSECRET: ${TINK__CLIENTSECRET:-}
      TINK__REDIRECTURI: ${TINK__REDIRECTURI:-http://localhost:5283/api/banking/tink/callback}
      TINK__CONTINUOUSACCESSVERIFIED: ${TINK__CONTINUOUSACCESSVERIFIED:-false}
      BANKING__ATTEMPTLIFETIMEMINUTES: ${BANKING__ATTEMPTLIFETIMEMINUTES:-15}
      SMTP__HOST: ${SMTP__HOST:-smtp.example.com}
      SMTP__PORT: ${SMTP__PORT:-587}
      SMTP__SECURITYMODE: ${SMTP__SECURITYMODE:-StartTls}
      SMTP__CHECKCERTIFICATEREVOCATION: ${SMTP__CHECKCERTIFICATEREVOCATION:-true}
      SMTP__USERNAME: ${SMTP__USERNAME:-}
      SMTP__PASSWORD: ${SMTP__PASSWORD:-}
      SMTP__SENDEREMAIL: ${SMTP__SENDEREMAIL:-noreply@example.com}
      SMTP__SENDERNAME: ${SMTP__SENDERNAME:-4Money}
      SMTP__TIMEOUTSECONDS: ${SMTP__TIMEOUTSECONDS:-30}
      OCR_BASE_URL: http://extraction-worker:8000
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:8333}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-receipts}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_URL_EXPIRATION_MINUTES: ${STORAGE_URL_EXPIRATION_MINUTES:-15}
      USER_ICON_PRESET_PREFIX: ${USER_ICON_PRESET_PREFIX:-icons/presets/users/}
      GROUP_ICON_PRESET_PREFIX: ${GROUP_ICON_PRESET_PREFIX:-icons/presets/groups/}
      RECEIPT_STORAGE_PREFIX: ${RECEIPT_STORAGE_PREFIX:-receipts/}
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-5283}:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      extraction-worker:
        condition: service_started
    restart: unless-stopped

volumes:
  zpi4m_pgdata:
    name: ${POSTGRES_VOLUME_NAME:-zpi4m_zpi4m_pgdata}
  storage_data:
    name: ${STORAGE_VOLUME_NAME:-zpi4m_storage_data}
  model-cache:
    name: ${EXTRACTION_VOLUME_NAME:-extraction_worker_model-cache}
